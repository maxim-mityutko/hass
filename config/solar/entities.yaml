template:
  - sensor:
    # Duplicate of the original Growatt sensor but with configured state class. 
    # Otherwise the sensor is not popping up in the energy dashboard
    - name: Solar Output Power
      unique_id: solar_output_power
      device_class: power
      state_class: measurement
      unit_of_measurement: W  
      state: >-
        {{ states('sensor.growatt_output_power') }}
      availability: >-
        {{ is_number(states("sensor.growatt_output_power")) }}
  - sensor:
    # Duplicate of the original WaterP1MeterKit sensor but with configured device class. 
    # Otherwise the sensor throws error in energy dashboard
    - name: Water Usage
      unique_id: water_usage
      device_class: volume_flow_rate
      state_class: measurement
      unit_of_measurement: L/min
      state: >-
        {{ states('sensor.waterp1meterkit_waterp1meterkit_current_usage') }}
      availability: >-
        {{ is_number(states("sensor.waterp1meterkit_waterp1meterkit_current_usage")) }}

sensor:
  # Integrate the measured AC output power. This intentionally starts at the
  # point Home Assistant begins recording; it does not use Growatt's raw
  # lifetime counter.
  - platform: integration
    name: Solar Output Energy
    unique_id: solar_output_energy
    source: sensor.solar_output_power
    method: left
    round: 2
    unit_prefix: k
    unit_time: h
    max_sub_interval: 0

  # Retain up to 100,000 output-power samples and expose the highest recorded
  # value. With recorder enabled, Home Assistant restores this history after a
  # restart; it is not the inverter's manufacturer-reported peak.
  - platform: statistics
    name: Growatt maximum output power
    unique_id: growatt_bw14100089_maximum_output_power
    entity_id: sensor.growatt_output_power
    state_characteristic: value_max
    sampling_size: 100000
    precision: 1

# Grott publishes a retained JSON payload on energy/growatt. Values are raw
# integers; the divisors match Grott's T060104X record layout.
mqtt:
  sensor:
    - &grott_sensor
      name: Growatt status
      unique_id: growatt_bw14100089_status
      state_topic: energy/growatt
      value_template: "{{ value_json.values.pvstatus }}"
      device:
        identifiers:
          - growatt_bw14100089
        name: Growatt inverter BW14100089
        manufacturer: Growatt
        model: T060104X

    - <<: *grott_sensor
      name: Growatt solar power
      unique_id: growatt_bw14100089_solar_power
      device_class: power
      state_class: measurement
      unit_of_measurement: W
      value_template: "{{ value_json.values.pvpowerin | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt output power
      unique_id: growatt_bw14100089_output_power
      device_class: power
      state_class: measurement
      unit_of_measurement: W
      value_template: "{{ value_json.values.pvpowerout | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt PV1 voltage
      unique_id: growatt_bw14100089_pv1_voltage
      device_class: voltage
      state_class: measurement
      unit_of_measurement: V
      value_template: "{{ value_json.values.pv1voltage | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt PV1 current
      unique_id: growatt_bw14100089_pv1_current
      device_class: current
      state_class: measurement
      unit_of_measurement: A
      value_template: "{{ value_json.values.pv1current | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt PV1 power
      unique_id: growatt_bw14100089_pv1_power
      device_class: power
      state_class: measurement
      unit_of_measurement: W
      value_template: "{{ value_json.values.pv1watt | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt PV2 voltage
      unique_id: growatt_bw14100089_pv2_voltage
      device_class: voltage
      state_class: measurement
      unit_of_measurement: V
      value_template: "{{ value_json.values.pv2voltage | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt PV2 current
      unique_id: growatt_bw14100089_pv2_current
      device_class: current
      state_class: measurement
      unit_of_measurement: A
      value_template: "{{ value_json.values.pv2current | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt PV2 power
      unique_id: growatt_bw14100089_pv2_power
      device_class: power
      state_class: measurement
      unit_of_measurement: W
      value_template: "{{ value_json.values.pv2watt | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt grid voltage
      unique_id: growatt_bw14100089_grid_voltage
      device_class: voltage
      state_class: measurement
      unit_of_measurement: V
      value_template: "{{ value_json.values.pvgridvoltage | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt grid current
      unique_id: growatt_bw14100089_grid_current
      device_class: current
      state_class: measurement
      unit_of_measurement: A
      value_template: "{{ value_json.values.pvgridcurrent | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt grid power
      unique_id: growatt_bw14100089_grid_power
      device_class: power
      state_class: measurement
      unit_of_measurement: W
      value_template: "{{ value_json.values.pvgridpower | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt grid frequency
      unique_id: growatt_bw14100089_grid_frequency
      device_class: frequency
      state_class: measurement
      unit_of_measurement: Hz
      value_template: "{{ value_json.values.pvfrequentie | float(0) / 100 }}"

    - <<: *grott_sensor
      name: Growatt inverter temperature
      unique_id: growatt_bw14100089_inverter_temperature
      device_class: temperature
      state_class: measurement
      unit_of_measurement: °C
      value_template: "{{ value_json.values.pvtemperature | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt energy today
      unique_id: growatt_bw14100089_energy_today
      device_class: energy
      state_class: total
      unit_of_measurement: kWh
      value_template: "{{ value_json.values.pvenergytoday | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt lifetime energy
      unique_id: growatt_bw14100089_lifetime_energy
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: kWh
      value_template: "{{ value_json.values.pvenergytotal | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt PV1 energy today
      unique_id: growatt_bw14100089_pv1_energy_today
      device_class: energy
      state_class: total
      unit_of_measurement: kWh
      value_template: "{{ value_json.values.epv1today | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt PV1 lifetime energy
      unique_id: growatt_bw14100089_pv1_lifetime_energy
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: kWh
      value_template: "{{ value_json.values.epv1total | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt PV2 energy today
      unique_id: growatt_bw14100089_pv2_energy_today
      device_class: energy
      state_class: total
      unit_of_measurement: kWh
      value_template: "{{ value_json.values.epv2today | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt PV2 lifetime energy
      unique_id: growatt_bw14100089_pv2_lifetime_energy
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: kWh
      value_template: "{{ value_json.values.epv2total | float(0) / 10 }}"

    - <<: *grott_sensor
      name: Growatt total PV energy
      unique_id: growatt_bw14100089_total_pv_energy
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: kWh
      value_template: "{{ value_json.values.epvtotal | float(0) / 10 }}"
